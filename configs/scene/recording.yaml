# =============================================================================
# 采集录制配置：MCAP topic 名 + 多相机（第三人称 + 双腕）
# 被 configs/scene/cli.yaml → collect.recording 引用
# 修改相机机位 / Foxglove 话题名：只改本文件
# =============================================================================

# ----- Foxglove / MCAP 话题（可按项目规范改名）-----
topics:
  tf: /tf
  log: /task/log
  # 采集前标定结果（内参 K + 外参 T）整包 JSON
  calibration: /camera/calibration
  ee_left: /robot/ee/left
  ee_right: /robot/ee/right
  action_target: /action/target
  # 物品位姿话题 = props_prefix + 物品名，例如 /props/red_cube
  props_prefix: /props/
  cameras:
    third_person: /cam/third_person/compressed
    wrist_left: /cam/wrist_left/compressed
    wrist_right: /cam/wrist_right/compressed

# ----- 相机公共参数 -----
cameras:
  enabled: true
  width: 640
  height: 480
  # 每隔多少控制步抓一帧（越小越密，MCAP 越大）
  every_n_steps: 2
  jpeg_quality: 85

  # 三个机位：第三人称 D455 + 双腕 D405（内参由 CameraPlugin / 资产补全）
  views:
    # 第三人称：Intel RealSense D455，世界系固定机位
    - name: third_person
      type: world
      role: third_person
      camera_asset: realsense_d455
      pos: [0.05, -0.55, 1.20]
      lookat: [0.18, 0.40, 0.45]
      fovy_deg: 58.0
      intrinsics: {fx: 390.0, fy: 390.0, cx: 320.0, cy: 240.0}

    # 左腕：Intel RealSense D405，挂在左臂 TCP site
    - name: wrist_left
      type: site
      role: wrist
      camera_asset: realsense_d405
      # 与 backend.scene 的 left_prefix + tcp_site_suffix 一致：L_ + g_pinch
      site: L_g_pinch
      offset_xyz: [0.0, 0.04, -0.10]
      lookat_xyz: [0.0, 0.0, 0.08]
      fovy_deg: 58.0
      intrinsics: {fx: 430.0, fy: 430.0, cx: 320.0, cy: 240.0}

    # 右腕 D405
    - name: wrist_right
      type: site
      role: wrist
      camera_asset: realsense_d405
      site: R_g_pinch
      offset_xyz: [0.0, 0.04, -0.10]
      lookat_xyz: [0.0, 0.0, 0.08]
      fovy_deg: 58.0
      intrinsics: {fx: 430.0, fy: 430.0, cx: 320.0, cy: 240.0}
