# =============================================================================
# 三维模型库（场景搭建「从模型库拉取」）
# =============================================================================
# default_root: 相对项目根的目录；其下 *.yaml 与 user/*.yaml 均为可拉取物品
# 也可在工坊内点「更换模型库目录」临时覆盖（写入本文件的 override_root）
#
# 默认库已含：红色方块、蓝色盘子、绿色方块、黄色圆柱、灰色盒子、白色小球
# 自定义：复制 configs/scene/props/_template.yaml 改名，或换到自己的目录

default_root: configs/scene/props

# 非空时优先于 default_root（工坊「更换模型库」会写入）
override_root: ""

# 额外扫描目录（相对项目根或绝对路径），同名以后者覆盖
extra_roots: []
