# 交互式主菜单：标签与 handler 均在此配置，代码只做动态加载
banner: "PET / birth_teleop 交互式终端"
instructions: "↑↓ 选择 · Enter 确认 · Ctrl+C 取消/退出"
press_enter_message: "按回车返回主菜单…"
exit_message: "再见。"

actions:
  - id: pico_sim_one_click
    label: "一键：Pico 仿真遥操（推荐）"
    handler: "birth_teleop.cli.actions:action_pico_sim_one_click"
  - id: run_teleop
    label: "自定义遥操配置"
    handler: "birth_teleop.cli.actions:action_run_teleop"
  - id: setup_xrobo
    label: "安装 / 检查 Pico·XRobo 依赖"
    handler: "birth_teleop.cli.actions:action_setup_xrobo"
  - id: show_defaults
    label: "查看默认 Hydra 配置摘要"
    handler: "birth_teleop.cli.actions:action_show_defaults"
  - id: run_tests
    label: "运行单元测试 (pytest)"
    handler: "birth_teleop.cli.actions:action_run_tests"
  - id: exit
    label: "退出"
    handler: null
