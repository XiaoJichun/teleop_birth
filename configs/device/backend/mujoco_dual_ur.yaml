# =============================================================================
# 后端：MuJoCo 双 UR5e + Robotiq 2F-85
# 改桌子/灯光/home 姿态/TCP site 名：本文件
# IK 求解器参数：configs/algorithm/ik/*.yaml（不要写在这里）
# =============================================================================
type: mujoco_dual_ur
kind: sim

scene:
  model_name: "dual_ur5e_2f85"
  base_height: 0.42          # 基座离地高度 (m)
  base_x: 0.45               # 基座沿 x 偏移
  integrator: "implicitfast"
  cone: "elliptic"
  impratio: 10.0
  light:
    pos: [0.0, 0.0, 2.8]
    dir: [0.0, 0.0, -1.0]
    diffuse: [0.8, 0.8, 0.8]
  ground:
    size: [2.5, 2.5, 0.1]
    rgba: [0.92, 0.92, 0.92, 1.0]
  # 桌面：物品随机摆放工作区以此为界
  table:
    size: [0.55, 0.35, 0.02]
    pos_xy: [0.0, 0.40]
    z_offset_from_base: -0.02
    rgba: [0.55, 0.40, 0.28, 1.0]
  ur5e_xml: "universal_robots_ur5e/ur5e.xml"
  gripper_xml: "robotiq_2f85/2f85.xml"
  gripper_attach_site: "attachment_site"
  gripper_prefix: "g_"
  left_prefix: "L_"
  right_prefix: "R_"
  arm_actuator_suffixes:
    - shoulder_pan
    - shoulder_lift
    - elbow
    - wrist_1
    - wrist_2
    - wrist_3
  gripper_actuator_suffix: "g_fingers_actuator"
  # 腕部相机挂点 = left/right_prefix + tcp_site_suffix → L_g_pinch / R_g_pinch
  tcp_site_suffix: "g_pinch"
  settle_steps: 200
  left_home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  right_home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

sim_substeps: 4   # 每个控制步内的物理子步
render: false     # 遥操默认是否开窗；采集另见 scene/cli.yaml
