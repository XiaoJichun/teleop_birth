# =============================================================================
# 终端菜单（./start.sh）
# 改菜单文案/顺序/入口：本文件
# 一键采集参数：configs/scene/cli.yaml → collect
# =============================================================================
banner: "PET / teleop_birth 交互式终端"
prompt: "请选择"
instructions: "一键项直接读 configs/ 启动；改参数请编辑 YAML（见 doc/配置文件指南.md）"
exit_message: "再见。"
press_enter_message: "按回车返回主菜单…"
actions:
  - id: pico_sim_one_click
    label: "一键：Pico 仿真遥操"
    handler: "teleop_birth.cli.actions:action_pico_sim_one_click"
  - id: scene_collect_one_click
    label: "一键：自动化采数据（开窗口可盯着看 → MCAP）"
    handler: "teleop_birth.cli.actions:action_scene_collect_one_click"
  - id: scene_generate_one_click
    label: "一键：生成场景物品（红方块+蓝盘子）"
    handler: "teleop_birth.cli.actions:action_scene_generate_one_click"
  - id: scene_place_one_click
    label: "一键：随机摆放物品"
    handler: "teleop_birth.cli.actions:action_scene_place_one_click"
  - id: run_teleop
    label: "自定义：遥操配置（设备/算法/IK）"
    handler: "teleop_birth.cli.actions:action_run_teleop"
  - id: scene_generate_props
    label: "自定义：生成物品（逐步提问）"
    handler: "teleop_birth.cli.actions:action_scene_generate_props"
  - id: scene_place_props
    label: "自定义：摆放物品（逐步提问）"
    handler: "teleop_birth.cli.actions:action_scene_place_props"
  - id: scene_collect
    label: "自定义：语义采集（逐步提问）"
    handler: "teleop_birth.cli.actions:action_scene_collect"
  - id: setup_xrobo
    label: "安装 / 检查 Pico·XRobo 依赖"
    handler: "teleop_birth.cli.actions:action_setup_xrobo"
  - id: show_defaults
    label: "查看默认配置摘要"
    handler: "teleop_birth.cli.actions:action_show_defaults"
  - id: run_tests
    label: "运行单元测试"
    handler: "teleop_birth.cli.actions:action_run_tests"
  - id: exit
    label: "退出"
    handler: null
