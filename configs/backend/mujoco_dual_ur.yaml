# 后端：MuJoCo 双 UR5e + 2F-85（参数全部可覆盖，禁止在代码写死）
type: mujoco_dual_ur

scene:
  model_name: "dual_ur5e_2f85"
  base_height: 0.42
  base_x: 0.45
  integrator: "implicitfast"   # implicitfast | euler | rk4
  cone: "elliptic"             # elliptic | pyramidal
  impratio: 10.0
  light:
    pos: [0.0, 0.0, 2.8]
    dir: [0.0, 0.0, -1.0]
    diffuse: [0.8, 0.8, 0.8]
  ground:
    size: [2.5, 2.5, 0.1]
    rgba: [0.92, 0.92, 0.92, 1.0]
  table:
    size: [0.55, 0.35, 0.02]
    pos_xy: [0.0, 0.40]
    z_offset_from_base: -0.02
    rgba: [0.55, 0.40, 0.28, 1.0]
  # menagerie 相对路径（相对 paths.menagerie）
  ur5e_xml: "universal_robots_ur5e/ur5e.xml"
  gripper_xml: "robotiq_2f85/2f85.xml"
  gripper_attach_site: "attachment_site"
  gripper_prefix: "g_"
  left_prefix: "L_"
  right_prefix: "R_"
  arm_actuator_suffixes:
    - shoulder_pan
    - shoulder_lift
    - elbow
    - wrist_1
    - wrist_2
    - wrist_3
  gripper_actuator_suffix: "g_fingers_actuator"
  tcp_site_suffix: "g_pinch"
  settle_steps: 200
  left_home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  right_home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

ik:
  iters: 14
  damping: 0.06
  pos_weight: 1.0
  rot_weight: 0.0
  max_dq: 0.18
  err_tol: 0.001
  position_only: true
  viewer_sync_every: 2

# 每个控制周期仿真子步（过大只会增加延迟）
sim_substeps: 1

render: false
