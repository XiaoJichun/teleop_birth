# =============================================================================
# 双臂物流工位（一字型平行双带 · 与桌面齐平）
# - 入站(+Y) / 出站(-Y) 平行、沿 Y 延伸，间距加大
# - 传送带顶面 = 桌面顶面（可平面推送）
# - 动作：左臂取入站 → 双手翻面 → 右臂推送到出站
# =============================================================================

model_name: logistics_dual_artixon_6a
timestep: 0.002
table_z: 0.42
# 半尺寸：Y 方向加长以容纳更大带间距
table_size: [0.48, 0.62, 0.02]
tcp_pos: [0.08, 0.0, 0.0]

left_arm_xy: [0.05, 0.16]
right_arm_xy: [0.05, -0.16]
# 双臂同侧（-X 操作员侧），回零 TCP 朝向桌面作业区（俯抓）
home_q_left: [-0.21, 1.76, -1.15, 0.97, 0.0, -0.21]
home_q_right: [0.20, 1.76, -1.15, 0.97, 0.0, 0.20]

work_xy: [0.38, 0.0]
# 带间距加大：中心距 0.76m
in_xy: [0.38, 0.38]
out_xy: [0.38, -0.38]

# 带顶与桌面齐平：pos_z + size_z = table_z + table_size_z = 0.44
in_conveyor:
  pos: [0.38, 0.38, 0.428]
  size: [0.10, 0.18, 0.012]

out_conveyor:
  pos: [0.38, -0.38, 0.428]
  size: [0.10, 0.18, 0.012]

# 桌面 base 插件：换臂时只改 arm_id / configs/plugins/frame/desktop_bases.yaml
desktop_base:
  arm_id: artixon_6a

packages:
  - name: pkg_0
    size: [0.045, 0.025, 0.020]
    rgba: [0.92, 0.72, 0.35, 1.0]
    label_rgba: [0.97, 0.97, 0.97, 1.0]
    pos: [0.38, 0.38, 0.460]
    label_up: false
    mass: 0.10
  - name: pkg_1
    size: [0.045, 0.025, 0.020]
    rgba: [0.86, 0.58, 0.28, 1.0]
    label_rgba: [0.97, 0.97, 0.97, 1.0]
    pos: [0.50, 0.0, 0.460]
    label_up: true
    mass: 0.10
