# =============================================================================
# IK：cuRobo GPU（https://curobo.org/）
# 未安装 CUDA 版时 fallback→dls；切换: ik=curobo
# =============================================================================
solver: curobo
fallback: dls
position_only: false
viewer_sync_every: 1
iters: 20
damping: 0.04
pos_weight: 1.0
rot_weight: 0.85
max_dq: 0.28
err_tol: 0.0008
curobo:
  robot_yml: ur5e.yml
  num_seeds: 20
  position_threshold: 0.005
  rotation_threshold: 0.05
  self_collision_check: false
  self_collision_opt: false
  use_cuda_graph: true
