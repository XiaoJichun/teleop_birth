# =============================================================================
# 映射：双臂手柄 → SparseTarget（相对遥操）
# 姿态跟手怪：优先调 controller_quat_xyzw / scale / max_step_*
# =============================================================================
type: dual_arm
scale: 1.0
filter_alpha: 0.92
map_head: false

clutch_mode: long_press_grip
hold_s: 0.2
grip_threshold: 0.45

reset_buttons_left: ["y", "left_menu"]
reset_buttons_right: ["b", "right_menu"]

xr_align: openxr_yup_to_zup
# 可选：臂坐标剖面（与 configs/plugins/frame/arm_profiles.yaml 对应；仿真/真机共用）
# arm_profile: mujoco_table_zup
# 可选：语义映射直接生成 R_a（优先于 xr_align 名）
# xr_mapping:
#   right: "+x"
#   up: "+z"
#   forward: "+y"

# 可选：握把→夹爪体轴 M（尖端朝下 tip_down / 尖端朝前 tip_forward）
# grip_to_tcp: tip_down
# grip_to_tcp_mapping:
#   right: "+y"
#   up: "+x"
#   aim: "+z"

position_only: false
max_step_m: 0.08
max_step_rad: 0.45
workspace_radius_m: 0.90
workspace_center:
  left_ee: [-0.45, 0.30, 0.50]
  right_ee: [0.45, 0.30, 0.50]

# Trigger^gamma；<1 中段更灵敏、闭合更快
gripper_gamma: 0.55
