# =============================================================================
# Hydra 主配置（遥操入口）
# 场景采集不经过本文件，见 configs/scene/cli.yaml
#
# 真实内容在 algorithm/ 与 device/；根目录 symlink 仅用于短 override：
#   ik=ssik  source=xrobo  backend=mujoco_dual_ur
# =============================================================================
defaults:
  - runtime: default      # algorithm/runtime — 频率/时长
  - ik: dls               # algorithm/ik — 逆解求解器
  - mapper: dual_arm      # algorithm/mapper — 相对遥操映射
  - source: mock          # device/source — 输入源（mock|xrobo）
  - backend: mujoco_dual_ur  # device/backend — 仿真/真机
  - end_effector: gripper # device/end_effector
  - paths: default        # device/paths
  - _self_
