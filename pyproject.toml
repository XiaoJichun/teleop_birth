[project]
name = "birth-teleop"
version = "0.1.0"
description = "Progressive Extremity Teleop: Pico dual-arm → G1, YAML-driven interactive CLI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "mujoco>=3.1",
    "numpy>=1.24",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
xrobo = []  # 由 tools/scripts/install_xrobo.sh 注入 xrobotoolkit-sdk

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birth_teleop"]

[project.scripts]
birth-teleop = "birth_teleop.cli.app:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
