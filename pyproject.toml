[project]
name = "teleop-birth"
version = "0.1.0"
description = "Progressive Extremity Teleop: Pico dual-arm → G1, YAML-driven interactive CLI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "mujoco>=3.1",
    "numpy>=1.24",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
xrobo = []
ik = [
    "ssik>=5.0.0",
]
collect = [
    "foxglove-schemas-protobuf>=0.2.0",
    "mcap>=1.2.0",
    "mcap-protobuf-support>=0.5.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src 布局：src/teleop_birth → import teleop_birth
[tool.hatch.build.targets.wheel]
packages = ["src/teleop_birth"]

[tool.hatch.build.targets.wheel.sources]
"src/teleop_birth" = "teleop_birth"

[project.scripts]
teleop-birth = "teleop_birth.cli.app:main"
birth-teleop = "teleop_birth.cli.app:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
